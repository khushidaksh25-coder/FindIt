services:
  - type: web
    name: findit-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
